name: iOS TestFlight (Direktor)
run-name: Director TestFlight ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: App Store version (e.g. 1.0)
        required: true
        default: '1.0'

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Block upload until correct Sen Olsaydin App ID is configured
        run: |
          echo "::error::STOP: com.flixtoys.director belongs to Flix Director, not Flix Sen Olsaydın. Configure the correct App ID and matching provisioning profile before uploading."
          exit 1
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Check required secrets
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_PEM }}
          KEY: ${{ secrets.IOS_DIST_KEY_PEM }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for var in CERT KEY PROFILE ASC_KEY APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!var}" ]; then echo "::error::Missing secret: $var"; exit 1; fi
          done
      - name: Install and prepare iOS
        run: |
          npm ci
          npx cap add ios --packagemanager CocoaPods
      - name: Import existing Apple Distribution identity and profile
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_PEM }}
          KEY: ${{ secrets.IOS_DIST_KEY_PEM }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/signing" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s\n' "$CERT" > "$RUNNER_TEMP/signing/distribution.pem"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/signing/distribution.key"
          printf '%s' "$PROFILE" | base64 -D > "$RUNNER_TEMP/signing/director.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/signing/director.mobileprovision" > "$RUNNER_TEMP/signing/profile.plist"
          /usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/signing/profile.plist" > "$RUNNER_TEMP/signing/uuid"
          UUID=$(cat "$RUNNER_TEMP/signing/uuid")
          cp "$RUNNER_TEMP/signing/director.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/signing/profile.plist")
          if [ "$BUNDLE" != "$APPLE_TEAM_ID.com.flixtoys.director" ]; then echo "::error::Provisioning profile bundle mismatch"; exit 1; fi
          security create-keychain -p "$RUNNER_TEMP" flix-signing.keychain-db
          security set-keychain-settings -lut 21600 flix-signing.keychain-db
          security unlock-keychain -p "$RUNNER_TEMP" flix-signing.keychain-db
          security list-keychains -d user -s flix-signing.keychain-db login.keychain-db
          security default-keychain -s flix-signing.keychain-db
          security import "$RUNNER_TEMP/signing/distribution.key" -k flix-signing.keychain-db -T /usr/bin/codesign
          security import "$RUNNER_TEMP/signing/distribution.pem" -k flix-signing.keychain-db -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" flix-signing.keychain-db
          security find-identity -v -p codesigning flix-signing.keychain-db | grep -E 'Apple Distribution|iPhone Distribution' || { echo "::error::Signing identity not available in keychain"; exit 1; }
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
      - name: Set up manual signing for App target only
        env:
          APP_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          ruby -rxcodeproj -e '
            p = Xcodeproj::Project.open("ios/App/App.xcodeproj")
            t = p.targets.find { |x| x.name == "App" }
            abort "App target not found" unless t
            t.build_configurations.each do |c|
              c.build_settings["DEVELOPMENT_TEAM"] = ENV.fetch("APPLE_TEAM_ID")
              c.build_settings["CODE_SIGN_STYLE"] = "Manual"
              c.build_settings["CODE_SIGN_IDENTITY"] = "Apple Distribution"
              c.build_settings["PROVISIONING_PROFILE_SPECIFIER"] = ENV.fetch("PROFILE_UUID")
              c.build_settings["MARKETING_VERSION"] = ENV.fetch("APP_VERSION")
              c.build_settings["CURRENT_PROJECT_VERSION"] = ENV.fetch("BUILD_NUMBER")
            end
            p.save
          '
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Director.xcarchive" \
            archive | tail -n 100
      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>$APPLE_TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict>
          <key>com.flixtoys.director</key><string>$PROFILE_UUID</string>
          </dict>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Director.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 100
